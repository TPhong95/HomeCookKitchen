server:
  port: 8100

spring:
  application:
    name: gateway
  config:
    import: "optional:consul:"
  cloud:
    consul:
      host: consul
      port: 8500
      config:
        format: YAML
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                allowedHeaders:
                  - "*"
                allowedMethods:
                  - "GET"
                  - "POST"
                  - "PUT"
                  - "PATCH"
                  - "DELETE"
                  - "OPTIONS"
                allowCredentials: true
          routes:
            - id: chef-route
              uri: lb://chefuser
              predicates:
                - Path=/api/chef/**

            - id: customer-route
              uri: lb://custuser
              predicates:
                - Path=/api/customer/**

            - id: recipe-route
              uri: lb://recipe
              predicates:
                - Path=/api/recipe/**

            - id: productListing-route
              uri: lb://productlisting
              predicates:
                - Path=/api/productListing/**

            - id: purchase-route
              uri: lb://purchase
              predicates:
                - Path=/api/purchase/**

management:
  endpoints:
    web:
      exposure:
        include: "health,info"