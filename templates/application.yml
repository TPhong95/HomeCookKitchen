spring:
  application:
    name: #Name of application. Eks: chefuser
  datasource:
    driver-class-name: org.postgresql.Driver
    username: username
    password: password
    url: jdbc:postgresql://example_product:5432/example_name #This URl needs to be same as the one in docker-compose.yml
  jpa:
    generate-ddl: false #False if you want to use flyway migration
    show-sql: false
    properties:
     hibernate:
       dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    locations: classpath:db/migration/example_folder #Replace example: classpath:db/migration/chefuser
    enabled: true
  cloud:
    consul:
      host: consul
      port: 8500
server:
  port: 8006 #Port number for where the application runs. Needs to be same as the one in docker-compose.yml
management:
  endpoints:
    web:
      exposure:
        include: health, info