services:
  #-------------Logging----------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    networks:
      - m2026
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 30

  logstash:
    image: docker.elastic.co/logstash/logstash:9.2.3
    ports:
      - "5000:5000"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - m2026

  kibana:
    image: docker.elastic.co/kibana/kibana:9.2.3
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - m2026
  #TaskScheduler
  taskscheduler-service:
    image: taskscheduler-service:0.0.1-SNAPSHOT
    container_name: taskscheduler-service
    build:
      context: ./TaskScheduler
    ports:
      - "8020"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CONFIG_IMPORT: "optional:consul:"
      SPRING_CLOUD_CONSUL_HOST: "consul"
      SPRING_CLOUD_CONSUL_CONFIG_FORMAT: YAML
      LOGSTASH_DESTINATION: logstash:5000
    depends_on:
      consul-importer:
        condition: service_completed_successfully
    networks:
      - m2026

  #Kafka
  kafka:
    image: apache/kafka:4.3.2
    container_name: kafka
    ports:
      - "9092:9092"
    depends_on:
      - consul
    healthcheck:
      test: [ "CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9091,HOST://:9092,DOCKER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9091
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - m2026
  consul-register-kafka:
    image: curlimages/curl:8.8.0
    container_name: consul-register-kafka
    depends_on:
      - consul
      - kafka
    networks:
      - m2026
    restart: on-failure
    command: >
      sh -c "curl -s -X PUT http://consul:8500/v1/agent/service/register
      -H 'Content-Type: application/json'
      -d '{\"Name\": \"kafka\", \"Address\": \"kafka\", \"Port\": 9093}'"

  kafbat-ui: #Kafka web GUI
    image: docker.io/kafbat/kafka-ui:v1.5.0
    container_name: kafbat-ui
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      # Enable editing topics/messages within the web application interface
      DYNAMIC_CONFIG_ENABLED: 'true'
      # Configure the cluster connection pointing to the internal listener
      KAFKA_CLUSTERS_0_NAME: 'local-kraft-cluster'
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka:9093'
    networks:
      - m2026
    #(Add volumes to persist config later)

  consul-register-kafbat:
    image: curlimages/curl:8.8.0
    container_name: consul-register-kafbat
    depends_on:
      - consul
      - kafbat-ui
    networks:
      - m2026
    restart: on-failure
    command: >
      sh -c "curl -s -X PUT http://consul:8500/v1/agent/service/register
      -H 'Content-Type: application/json'
      -d '{\"Name\": \"kafbat-ui\", \"Address\": \"kafbat-ui\", \"Port\": 8080}'"

  #CONSUL
  consul:
    image: hashicorp/consul:2.0.0
    container_name: consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: agent -dev -node=m26 -client=0.0.0.0
    networks:
      - m2026

  #GATEWAY

  consul-importer:
    image: consul-importer
    build: ./consul
    depends_on:
      - consul
    networks:
      - m2026
  gateway:
    image: gateway:0.0.1-SNAPSHOT
    container_name: gateway
    build:
      context: ./gateway
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CONFIG_IMPORT: "optional:consul:"
      SPRING_CLOUD_CONSUL_HOST: "consul"
      SPRING_CLOUD_CONSUL_CONFIG_FORMAT: YAML
    ports:
      - "8100:8100"
    depends_on:
      consul-importer:
        condition: service_completed_successfully
    networks:
      - m2026
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8100/actuator/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

    #Frontend
  frontend:
    image: frontend:0.1
    container_name: frontend
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    networks:
      - m2026

  #CHEF SERVICE & DB
  postgres_chef:
    image: postgres:17-alpine
    container_name: postgres-chef
    environment:
      POSTGRES_DB: chefDB
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    restart: no
    networks:
      - m2026
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U username -d chefDB" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  chef-service:
    image: chef-service:0.0.1-SNAPSHOT
    build:
      context: ./user/chefuser
    ports:
      - "8002"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_chef:5432/chefDB
      SPRING_DATASOURCE_USERNAME: username
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_CONFIG_IMPORT: "optional:consul:"
      SPRING_CLOUD_CONSUL_HOST: "consul"
      SPRING_CLOUD_CONSUL_CONFIG_FORMAT: YAML
      LOGSTASH_DESTINATION: logstash:5000
    depends_on:
      postgres_chef:
        condition: service_healthy
      consul-importer:
        condition: service_completed_successfully
    networks:
      - m2026
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8002/actuator/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s


  #CUSTOMER SERVICE & DB
  postgres_customer:
    image: postgres:17-alpine
    container_name: postgres-customer
    environment:
      POSTGRES_DB: customerDB
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    restart: no
    networks:
      - m2026
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U username -d customerDB" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  customer-service:
    image: customer-service:0.0.1-SNAPSHOT
    build:
      context: ./user/customer
    ports:
      - "8003"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_customer:5432/customerDB
      SPRING_DATASOURCE_USERNAME: username
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_CONFIG_IMPORT: "optional:consul:"
      SPRING_CLOUD_CONSUL_HOST: "consul"
      SPRING_CLOUD_CONSUL_CONFIG_FORMAT: YAML
      LOGSTASH_DESTINATION: logstash:5000
    depends_on:
      postgres_customer:
        condition: service_healthy
      consul-importer:
        condition: service_completed_successfully
    networks:
      - m2026
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8003/actuator/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s


  # PURCHASE SERVICE & DB
  postgres_purchase:
    image: postgres:17-alpine
    container_name: postgres-purchase
    environment:
      POSTGRES_DB: purchaseDB
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"
    restart: no
    networks:
      - m2026
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U username -d purchaseDB" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  purchase-service:
    image: purchase-service:0.0.1-SNAPSHOT
    build:
      context: ./transactions/purchase
    ports:
      - "8011"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_purchase:5432/purchaseDB
      SPRING_DATASOURCE_USERNAME: username
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_CONFIG_IMPORT: "optional:consul:"
      SPRING_CLOUD_CONSUL_HOST: "consul"
      SPRING_CLOUD_CONSUL_CONFIG_FORMAT: YAML
      LOGSTASH_DESTINATION: logstash:5000
    depends_on:
      postgres_purchase:
        condition: service_healthy
      productlisting-service:
        condition: service_healthy
      consul-importer:
        condition: service_completed_successfully
    networks:
      - m2026
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8011/actuator/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s


  #PRODUCT SERVICE & DB
  postgres-productlisting:
    image: postgres:17-alpine
    container_name: postgres-productlistingDB
    environment:
      POSTGRES_DB: productlistingDB
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password

    ports:
      - "5434:5432"
    restart: no
    networks:
      - m2026
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U username -d productlistingDB" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  productlisting-service:
    image: productlisting-service:0.0.1-SNAPSHOT
    build:
      context: ./product/productlisting
    ports:
      - "8006"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-productlisting:5432/productlistingDB
      SPRING_DATASOURCE_USERNAME: username
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_CONFIG_IMPORT: "optional:consul:"
      SPRING_CLOUD_CONSUL_HOST: "consul"
      SPRING_CLOUD_CONSUL_CONFIG_FORMAT: YAML
      LOGSTASH_DESTINATION: logstash:5000
    depends_on:
      postgres-productlisting:
        condition: service_healthy
      recipe-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      consul-importer:
        condition: service_completed_successfully
    networks:
      - m2026
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8006/actuator/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  postgres-recipe:
    image: postgres:17-alpine
    container_name: postgres-recipeDB
    environment:
      POSTGRES_DB: recipeDB
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password

    ports:
      - "5436:5432"
    restart: no
    networks:
      - m2026
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U username -d recipeDB" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  recipe-service:
    image: recipe-service:0.0.1-SNAPSHOT
    build:
      context: ./product/Recipe
    ports:
      - "8008"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-recipe:5432/recipeDB
      SPRING_DATASOURCE_USERNAME: username
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_CONFIG_IMPORT: "optional:consul:"
      SPRING_CLOUD_CONSUL_HOST: "consul"
      SPRING_CLOUD_CONSUL_CONFIG_FORMAT: YAML
      LOGSTASH_DESTINATION: logstash:5000
    depends_on:
      postgres-recipe:
        condition: service_healthy
      chef-service:
        condition: service_healthy
      consul-importer:
        condition: service_completed_successfully
    networks:
      - m2026
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8008/actuator/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  initdata:
    build: ./initdata
    depends_on:
      chef-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      recipe-service:
        condition: service_healthy
      productlisting-service:
        condition: service_healthy
      purchase-service:
        condition: service_healthy
      gateway:
        condition: service_healthy
    restart: "no"
    networks:
      - m2026

networks:
  m2026:
    driver: bridge