version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: purchase-db-container
    environment:
      POSTGRES_DB: purchaseDB
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"
    restart: on-failure

  purchase-service:
    build: .
    container_name: purchase_service
    ports:
      - "8011"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_purchase:5432/purchaseDB
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    depends_on:
      - postgres
