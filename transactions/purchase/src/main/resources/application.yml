spring:
  application:
    name: purchase
  config:
    import: "optional:consul:"
  datasource:
    driver-class-name: org.postgresql.Driver
    username: username
    password: password
    url: jdbc:postgresql://postgres_purchase:5432/purchaseDB
  jpa:
    generate-ddl: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    locations: classpath:db/migration/purchase
    enabled: true
  cloud:
    consul:
      host: consul
      port: 8500
      config:
        format: YAML
  kafka:
    bootstrap-servers: kafka:9093
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        "[spring.json.add.type.headers]": false
server:
  port: 8011
management:
  endpoints:
    web:
      exposure:
        include: health, info