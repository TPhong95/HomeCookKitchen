spring:
  application:
    name: productlisting
  datasource:
    driver-class-name: org.postgresql.Driver
    username: username
    password: password
    url: jdbc:postgresql://postgres_productlisting:5432/productlistingDB
  jpa:
    generate-ddl: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    locations: classpath:db/migration/productlisting
    enabled: true
  cloud:
    consul:
      host: consul
      port: 8500
server:
  port: 8006
management:
  endpoints:
    web:
      exposure:
        include: health, info