spring:
  application:
    name: recipeproduct
  datasource:
    driver-class-name: org.postgresql.Driver
    username: username
    password: password
    url: jdbc:postgresql://postgres_product:5432/productDB
  jpa:
    generate-ddl: false
    show-sql: false
    properties:
     hibernate:
       dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    locations: classpath:db/migration/recipeproduct
    enabled: true
  cloud:
    consul:
      host: consul
      port: 8500
server:
  port: 8006
management:
  endpoints:
    web:
      exposure:
        include: health, info