version: '3.8'



services:

  #CONSUL
  consul:
    image: hashicorp/consul:2.0.0
    container_name: consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: agent -dev -node=m26 -client=0.0.0.0
    networks:
      - m2026

  #GATEWAY
  gateway:
    image: gateway:0.0.1-SNAPSHOT
    container_name: gateway
    build:
      context: ./gateway
    environment:
      SPRING_CONFIG_IMPORT: "optional:consul:"
      SPRING_CLOUD_CONSUL_HOST: "consul"
    ports:
      - "8100:8100"
    depends_on:
      - consul
    networks:
      - m2026

   #Frontend
  frontend:
    image: frontend:0.1
    container_name: frontend
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    networks:
      - m2026

  #CHEF SERVICE & DB
  postgres_chef:
    image: postgres:17-alpine
    container_name: postgres-chef
    environment:
      POSTGRES_DB: chefDB
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    restart: on-failure
    networks:
      - m2026

  chef-service:
    image: chef-service:0.0.1-SNAPSHOT
    container_name: chef-service
    build:
      context: ./user/chefuser
    ports:
      - "8002"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_chef:5432/chefDB
      SPRING_DATASOURCE_USERNAME: username
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_CONFIG_IMPORT: "optional:consul:"
      SPRING_CLOUD_CONSUL_HOST: "consul"
    depends_on:
      - postgres_chef
      - consul
    networks:
      - m2026


  #CUSTOMER SERVICE & DB
  postgres_customer:
    image: postgres:17-alpine
    container_name: postgres-customer
    environment:
      POSTGRES_DB: customerDB
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    restart: on-failure
    networks:
      - m2026

  customer-service:
    image: customer-service:0.0.1-SNAPSHOT
    container_name: customer-service
    build:
      context: ./user/customer
    ports:
      - "8003"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_customer:5432/customerDB
      SPRING_DATASOURCE_USERNAME: username
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_CONFIG_IMPORT: "optional:consul:"
      SPRING_CLOUD_CONSUL_HOST: "consul"
    depends_on:
      - postgres_customer
      - consul
    networks:
      - m2026


  # PURCHASE SERVICE & DB
  postgres_purchase:
    image: postgres:17-alpine
    container_name: postgres-purchase
    environment:
      POSTGRES_DB: purchaseDB
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"
    restart: on-failure
    networks:
      - m2026

  purchase-service:
    image: purchase-service:0.0.1-SNAPSHOT
    container_name: purchase-service
    build:
      context: ./transactions/purchase
    ports:
      - "8011"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_purchase:5432/purchaseDB
      SPRING_DATASOURCE_USERNAME: username
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_CONFIG_IMPORT: "optional:consul:"
      SPRING_CLOUD_CONSUL_HOST: "consul"
    depends_on:
      - postgres_purchase
      - consul
    networks:
      - m2026


  #PRODUCT SERVICE & DB
  postgres_product:
    image: postgres:17-alpine
    container_name: postgres-product
    environment:
      POSTGRES_DB: productDB
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    restart: on-failure
    networks:
      - m2026

  product-service:
    image: product-service:0.0.1-SNAPSHOT
    container_name: recipeproduct-service
    build:
      context: ./product/recipeproduct
    ports:
      - "8006"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_product:5432/productDB
      SPRING_DATASOURCE_USERNAME: username
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_CONFIG_IMPORT: "optional:consul:"
      SPRING_CLOUD_CONSUL_HOST: "consul"
    depends_on:
      - postgres_product
      - consul
    networks:
      - m2026


networks:
  m2026:
    driver: bridge