spring:
  application:
    name: ChefUser
  datasource:
    driver-class-name: org.postgresql.Driver
    username: username
    password: password
    url: jdbc:postgresql://localhost:5433/customerDB
  jpa:
    generate-ddl: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    locations: classpath:db/migration/chefuser
    enabled: true
  cloud:
    consul:
      host: consul
      port: 8500
server:
  port: 8002
