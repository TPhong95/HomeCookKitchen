spring:
  application:
    name: chefuser
  config:
    import: "optional:consul:"
  datasource:
    driver-class-name: org.postgresql.Driver
    username: username
    password: password
    url: jdbc:postgresql://postgres_chef:5432/chefDB
  jpa:
    generate-ddl: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    locations: classpath:db/migration/chefuser
    enabled: true
  cloud:
    consul:
      host: consul
      port: 8500
      config:
        format: YAML
server:
  port: 8002
management:
  endpoints:
    web:
      exposure:
        include: health, info