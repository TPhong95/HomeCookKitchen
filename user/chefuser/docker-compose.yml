version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres-chefDB
    environment:
      POSTGRES_DB: chefDB
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    restart: on-failure

  chef-service:
    build: .
    container_name: chef_service
    ports:
      - "8002"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://chef_postgres:5432/chefDB
      SPRING_DATASOURCE_USERNAME: username
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      - postgres